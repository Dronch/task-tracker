[project]
name = "task-tracker"
version = "0.1.0"
description = "REST API for task management"
readme = "README.md"
authors = [
    { name = "Andrey Zybin", email = "dr0shik90@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=6.0,<6.1",
    "django-filter>=25.2,<26",
    "django-simple-history>=3.12,<4",
    "djangorestframework>=3.16,<4",
    "djangorestframework-simplejwt>=5.5,<6",
    "drf-spectacular>=0.29,<1",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3,<4",
    "pre-commit>=4.3,<5",
    "pytest>=8.4,<10",
    "pytest-cov>=7,<8",
    "pytest-django>=4.11,<5",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["src/**/migrations/*.py"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/config/settings/local.py" = ["F403"]
"src/config/settings/test.py" = ["F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
